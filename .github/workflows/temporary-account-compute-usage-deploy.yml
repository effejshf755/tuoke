name: Temporary Tuoke account compute usage deployment

on:
  push:
    branches:
      - codex/deploy-account-compute-usage-r1-20260810

permissions:
  contents: read

concurrency:
  group: tuoke-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: 80.253.254.177
      DEPLOY_USER: root
      EXPECTED_SHA256: 53e0e32ecc437b3af01e8b439c4e61f2e984a8e991710c3de0705d046aa435bc
      PAYLOAD_FILE: deployment-payload/account-compute-usage-20260810-r1.tgz
      SSHPASS: ${{ secrets.TUOKE_DEPLOY_PASSWORD_RELAY_STABILITY_V2_R1_RETRY_20260809 }}

    steps:
      - name: Check out immutable deployment payload
        uses: actions/checkout@v4

      - name: Verify exact payload hash
        run: |
          actual_sha="$(sha256sum "$PAYLOAD_FILE" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA256"
          echo payload_sha256_verified=true

      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Pin production host identity
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '80.253.254.177 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJS003ozsuy8Lbn3Km0Nf/ixxJEFTpLV8aiBEIHc/IO5' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Read-only production preflight
        run: |
          sshpass -e ssh \
            -o BatchMode=no \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu
             expected="migration-japan/tuokeapi:20260810-compute-point-billing-r1"
             state="$(docker inspect --format "{{.State.Status}}" tuoke-prod-freellmapi-1)"
             image="$(docker inspect --format "{{.Config.Image}}" tuoke-prod-freellmapi-1)"
             image_id="$(docker inspect --format "{{.Image}}" tuoke-prod-freellmapi-1)"
             release="$(docker image inspect --format "{{index .Config.Labels \"tuoke.release\"}}" "$image")"
             client_hash="$(docker exec tuoke-prod-freellmapi-1 sha256sum /app/server/dist/lib/client-context.js | cut -d " " -f 1)"
             points_hash="$(docker exec tuoke-prod-freellmapi-1 sha256sum /app/server/dist/services/compute-points.js | cut -d " " -f 1)"
             quota_hash="$(docker exec tuoke-prod-freellmapi-1 sha256sum /app/server/dist/middleware/consumerQuota.js | cut -d " " -f 1)"
             request_hash="$(docker exec tuoke-prod-freellmapi-1 sha256sum /app/server/dist/lib/request-log.js | cut -d " " -f 1)"
             responses_hash="$(docker exec tuoke-prod-freellmapi-1 sha256sum /app/server/dist/routes/responses.js | cut -d " " -f 1)"
             admin_hash="$(docker exec tuoke-prod-freellmapi-1 sha256sum /app/server/dist/routes/admin-users.js | cut -d " " -f 1)"
             billing_hash="$(docker exec tuoke-prod-freellmapi-1 sha256sum /app/server/dist/services/billing.js | cut -d " " -f 1)"
             converter="$(docker exec tuoke-prod-freellmapi-1 sh -lc "test -e /app/server/dist/lib/compute-points-response.js && echo present || echo absent")"
             printf "::notice title=Production baseline::state=%s image=%s image_id=%s release=%s converter=%s\n" "$state" "$image" "$image_id" "$release" "$converter"
             printf "::notice title=Production module hashes::client=%s points=%s quota=%s request=%s responses=%s admin=%s billing=%s\n" "$client_hash" "$points_hash" "$quota_hash" "$request_hash" "$responses_hash" "$admin_hash" "$billing_hash"
             test "$state" = running
             test "$image" = "$expected"
             test "$release" = compute-point-billing-20260810-r1
             test -n "$image_id"
             test -f /srv/tuoke-prod/docker-compose.yml
             docker exec tuoke-prod-freellmapi-1 test -s /app/server/data/freeapi.db
             test "$client_hash" = 8de403e929074013bb34258db747b6fce0972fdf3afbdb4f578e704cc43378e0
             test "$points_hash" = 6114b4ba2fafec28863f9ba55b0b15ece6bbff1415fd6993321e6181e994e870
             test "$quota_hash" = 0003341063cd1009c9fb7f8b0e7322589f2185caf71cd7f8a9fa8a25a40cfa98
             test "$request_hash" = b71d7e96e3d335de83641303c7ec9e4091199459d8608364501a1291c0ccbc7b
             test "$responses_hash" = ae254adb8a526ae7634155ddc63359c36d0db918df3d91862abd3dd713718a52
             test "$admin_hash" = c852ad7117221bf0af14750aebec7a4f9dc78f35d76cc15e46d1f2f5a70e990c
             test "$billing_hash" = ae4b17dd586f82ea99b53f9e30c7eca5f2337abd28cf1035aa66e030739c4279
             test "$converter" = absent
             printf "preflight_state=%s\npreflight_image=%s\npreflight_image_id=%s\n" "$state" "$image" "$image_id"'

      - name: Transfer exact verified payload
        id: payload
        run: |
          remote_archive="/tmp/tuoke-account-compute-usage-${GITHUB_RUN_ID}.tgz"
          remote_stage="/tmp/tuoke-account-compute-usage-${GITHUB_RUN_ID}"
          sshpass -e scp \
            -O \
            -o BatchMode=no \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$PAYLOAD_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          {
            echo "remote_archive=$remote_archive"
            echo "remote_stage=$remote_stage"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy with backup and automatic rollback
        run: |
          sshpass -e ssh \
            -o BatchMode=no \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- \
            '${{ steps.payload.outputs.remote_archive }}' \
            '${{ steps.payload.outputs.remote_stage }}' \
            "$EXPECTED_SHA256" <<'REMOTE'
          set -Eeuo pipefail
          archive="$1"
          stage="$2"
          expected_sha="$3"
          case "$archive" in /tmp/tuoke-account-compute-usage-[0-9]*.tgz) ;; *) exit 91 ;; esac
          case "$stage" in /tmp/tuoke-account-compute-usage-[0-9]*) ;; *) exit 92 ;; esac
          test -f "$archive"
          test ! -e "$stage"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum -c -
          install -d -m 0700 "$stage"
          tar -xzf "$archive" -C "$stage"
          release_root="$stage/account-compute-usage-20260810-r1"
          test -f "$release_root/deploy.sh"
          test -f "$release_root/MANIFEST.sha256"
          bash "$release_root/deploy.sh"
          REMOTE

      - name: Verify public production endpoint
        run: |
          ping_body="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors https://tuokeapi.com/api/ping)"
          python3 -c 'import json,sys; assert json.loads(sys.argv[1]).get("status") == "ok"' "$ping_body"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors https://tuokeapi.com/ >/dev/null
          echo public_verification=ok

      - name: Clean temporary remote payload
        if: always() && steps.payload.outputs.remote_archive != ''
        run: |
          sshpass -e ssh \
            -o BatchMode=no \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=password \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            rm -rf -- \
            '${{ steps.payload.outputs.remote_archive }}' \
            '${{ steps.payload.outputs.remote_stage }}'
