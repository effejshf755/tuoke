name: Deploy User Usage Privacy 20260812 R1

on:
  push:
    branches:
      - codex/deploy-user-usage-privacy-r1-20260812
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuoke-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSHPASS: ${{ secrets.TUOKE_DEPLOY_PASSWORD_RELAY_STABILITY_V2_R1_RETRY_20260809 || secrets.TUOKE_DEPLOY_PASSWORD_RELAY_STABILITY_V2_DIAG_20260809 }}
      DEPLOY_HOST: 80.253.254.177
      RELEASE_ARCHIVE: deployment/user-usage-privacy-20260812-r1.tgz
      RELEASE_SHA256: f108af1b86eaef7f156f3b380166f0754ffd99720a203bc5bde742d857f542e9
      REMOTE_ARCHIVE: /root/user-usage-privacy-20260812-r1.tgz
      REMOTE_RELEASE: /root/user-usage-privacy-20260812-r1

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH client helper
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Configure verified production host key
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          80.253.254.177 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJS003ozsuy8Lbn3Km0Nf/ixxJEFTpLV8aiBEIHc/IO5
          EOF
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Upload verified release archive
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || { echo "deployment password secret is unavailable" >&2; exit 1; }
          test -s "$RELEASE_ARCHIVE"
          printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_ARCHIVE" | sha256sum -c -
          sshpass -e scp \
            -O \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "$RELEASE_ARCHIVE" "root@$DEPLOY_HOST:$REMOTE_ARCHIVE"

      - name: Deploy with database backup and automatic rollback
        run: |
          set -Eeuo pipefail
          sshpass -e ssh \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "root@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          release='/root/user-usage-privacy-20260812-r1'
          archive='/root/user-usage-privacy-20260812-r1.tgz'
          expected_sha='f108af1b86eaef7f156f3b380166f0754ffd99720a203bc5bde742d857f542e9'
          test -s "$archive"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum -c -
          rm -rf -- "$release"
          install -d -m 0700 "$release"
          tar -xzf "$archive" -C "$release" --strip-components=1
          chmod 0700 "$release/deploy.sh"
          bash "$release/deploy.sh"
          REMOTE

      - name: Confirm public service and privacy asset
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://tuokeapi.com/api/ping
          html="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://tuokeapi.com/?v=${GITHUB_RUN_ID}")"
          grep -Fq '/assets/index-user-usage-privacy-r1.js' <<<"$html"
          bundle="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://tuokeapi.com/assets/index-user-usage-privacy-r1.js?v=${GITHUB_RUN_ID}")"
          grep -Fq 'TUOKE_USER_USAGE_PRIVACY_R1' <<<"$bundle"
